name: career-path-brief

services:
  app:
    image: ghcr.io/zhuotukeji/afs_education:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SEARCH_DB_ENABLED: "true"
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [web, private]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [private, web]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [web]

  backup:
    build: ./ops/backup
    restart: unless-stopped
    env_file: .env.production
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      MEDIA_PATH: /data/media
    volumes:
      - media:/data/media:ro
      - backup_cache:/root/.cache/restic
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

volumes:
  backup_cache:
  caddy_config:
  caddy_data:
  media:
  postgres_data:

networks:
  private:
    internal: true
  web:
