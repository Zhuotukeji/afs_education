name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable image
        env:
          TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          docker build --build-arg SITE_URL="${{ secrets.SITE_URL }}" -t "ghcr.io/zhuotukeji/afs_education:${TAG}" .
          docker push "ghcr.io/zhuotukeji/afs_education:${TAG}"
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy with rollback
        env:
          TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /srv/career-path-brief && IMAGE_TAG=${TAG} sh ./ops/deploy.sh"
